name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    # tools/package-runtime.ps1 drives d8, the NDK CMake toolchain and tar.exe,
    # and pins the Android Studio JBR. The bundle cannot be produced on Linux
    # without porting that script first, so the whole product is built here.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Write key
      run: |
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    # Produces dist/KhoiRevanced.sh: the self-extracting payload that the
    # manager APK embeds. The manager build fails fast if this is missing.
    - name: Package standalone runtime
      shell: pwsh
      run: ./tools/package-runtime.ps1 -Configuration Debug

    - name: Build manager Debug
      run: ./gradlew.bat :manager:assembleDebug --no-daemon --console=plain

    - name: Build manager Release
      run: ./gradlew.bat :manager:assembleRelease --no-daemon --console=plain

    - name: Verify the release bundle is complete
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $bundle = 'dist/KhoiRevanced.sh'
        if (-not (Test-Path $bundle)) { throw "Missing $bundle" }
        Write-Host "Runtime bundle: $((Get-Item $bundle).Length) bytes"
        $apk = Get-ChildItem 'manager/build/outputs/apk/release' -Filter '*.apk' | Select-Object -First 1
        if (-not $apk) { throw 'Manager release APK was not produced' }
        # An unsigned APK cannot be installed by a user, so never publish one.
        if ($apk.Name -like '*unsigned*') {
          throw "Release APK is unsigned ($($apk.Name)); signing.properties or the keystore secret is missing."
        }
        # The manager must never ship without its payload asset.
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = [System.IO.Compression.ZipFile]::OpenRead($apk.FullName)
        try {
            $asset = $zip.GetEntry('assets/KhoiRevanced.sh')
            if ($null -eq $asset) { throw 'Manager APK is missing assets/KhoiRevanced.sh' }
            Write-Host "Embedded runtime asset: $($asset.Length) bytes"
            if ($asset.Length -lt 1024) { throw 'Embedded runtime asset is truncated' }
        } finally { $zip.Dispose() }

    - name: Upload a Debug Artifact
      uses: actions/upload-artifact@v7
      with:
        name: khoirevanced-manager-debug-apk
        path: manager/build/outputs/apk/debug

    - name: Upload a Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: khoirevanced-manager-release-apk
        path: |
          manager/build/outputs/apk/release
          manager/build/outputs/mapping/release/mapping.txt
          dist/KhoiRevanced.sh

    - name: Create AutoBuild Release
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $latest = gh release view --json tagName -q .tagName
        $describe = git rev-parse --short HEAD
        $apk = Get-ChildItem 'manager/build/outputs/apk/release' -Filter '*.apk' | Select-Object -First 1
        $target = "KhoiRevanced-$describe.apk"
        Move-Item -Force $apk.FullName $target
        gh release delete autobuild --yes 2>$null
        gh release create autobuild $target `
          --prerelease `
          --title "Nightly Build $describe" `
          --notes "Nightly build from commit $describe. See changes: https://github.com/${{ github.repository }}/compare/$latest...main"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
