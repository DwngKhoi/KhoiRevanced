name: Android Release CI

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:

    # Keep in sync with android.yml: the runtime bundle is produced by
    # tools/package-runtime.ps1, which is Windows-only today.
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Write key
      run: |
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    - name: Package standalone runtime
      shell: pwsh
      run: ./tools/package-runtime.ps1 -Configuration Release

    - name: Build manager Release
      run: ./gradlew.bat :manager:assembleRelease --no-daemon --console=plain

    - name: Publish release
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $apk = Get-ChildItem 'manager/build/outputs/apk/release' -Filter '*.apk' | Select-Object -First 1
        if (-not $apk) { throw 'Manager release APK was not produced' }
        $target = "KhoiRevanced-${{ github.ref_name }}.apk"
        Move-Item -Force $apk.FullName $target
        gh release create --prerelease '${{ github.ref_name }}' $target
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
